<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product Details | Afiya Collection</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div id="toast-root" class="toast-root"></div>
    <div id="site-header"></div>
    <main>
        <div id="product-detail" class="container detail-wrap">
            <div class="loading-card">Loading product…</div>
        </div>
    </main>
    <div id="site-footer"></div>
    <div id="enquiry-modal" class="modal" aria-hidden="true">
        <div class="modal-panel"><button class="modal-close" data-close-modal>×</button><span class="eyebrow">PRODUCT
                ENQUIRY</span>
            <h2>Ask about this product</h2>
            <form id="enquiry-form"><input type="hidden" id="enquiryProductId"><label>Name<input id="customerName"
                        required maxlength="80"></label><label>Phone<input id="customerPhone" required inputmode="tel"
                        pattern="[0-9+ -]{8,18}"></label><label>Quantity<input id="quantity" required type="number"
                        min="1" step="0.1" value="1"></label><label>Product<input id="enquiryProductName"
                        readonly></label><label>Message<textarea id="enquiryMessage" maxlength="500"
                        rows="4"></textarea></label><button class="btn btn-primary" type="submit">Send Enquiry</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
    <script src="js/enquiry.js"></script>
    <script src="js/product-details.js"></script>
</body>

</html>
